$kind: http-request
description: |-
  **DELETE {{baseUrl}}/erp/giftboxes/{id}** — take the product out of Gifting. The product itself is **not** deleted and stays in the shop; the remaining giftboxes close the gap.

  - `404` if it is not in Gifting. No body.
  - Run this after 15–17 to clean up the test item.

  **Write request — local / staging only.** Never run against production without approval.

  *Added in API version 2.2. Verified by a local Postman CLI run (spec Section 15.8); not yet run against production.*
url: "{{baseUrl}}/erp/giftboxes/{{giftboxId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () {
        pm.expect(pm.response.code).to.be.oneOf([200]);
      });
      pm.test('removed from Gifting', function () { pm.expect(pm.response.json().data.isGifting).to.equal(false); });
    language: text/javascript
examples: ./.resources/18. Giftbox Remove.resources/examples
order: 19000
