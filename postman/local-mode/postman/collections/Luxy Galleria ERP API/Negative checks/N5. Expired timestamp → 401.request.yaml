$kind: http-request
description: |-
  Expects `401 X-ERP-Timestamp missing or more than 300s from server time`.

  Negative check: the request is refused before any data is read or changed. Safe to run in any environment.
url: "{{baseUrl}}/erp/orders?limit=1"
method: GET
queryParams:
  limit: "1"
scripts:
  - type: beforeRequest
    code: |-
      // A timestamp 10 minutes old is outside the ±300 s window; it is checked before the signature.
      pm.request.headers.upsert({ key: 'X-ERP-Timestamp', value: String(Math.floor(Date.now() / 1000) - 600) });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', function () {
        pm.expect(pm.response.code).to.equal(401);
      });
      pm.test('error code UNAUTHENTICATED', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.equal(false);
        pm.expect(body.errors[0].code).to.equal('UNAUTHENTICATED');
        pm.expect(body.message).to.match(/X-ERP-Timestamp/);
      });
    language: text/javascript
order: 6000
