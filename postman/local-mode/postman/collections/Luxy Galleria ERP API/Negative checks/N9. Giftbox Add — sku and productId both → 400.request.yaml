$kind: http-request
description: |-
  Expects `400 VALIDATION_ERROR` (send exactly one of `sku`, `productId`).

  Negative check: refused before any data is read or changed. Safe to run in any environment.
url: "{{baseUrl}}/erp/giftboxes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sku": "POSTMAN-NO-SUCH-SKU-0000",
      "productId": "000000000000000000000000"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () {
        pm.expect(pm.response.code).to.be.oneOf([400]);
      });
      pm.test('error code VALIDATION_ERROR', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.equal(false);
        pm.expect(body.errors[0].code).to.equal('VALIDATION_ERROR');
      });
    language: text/javascript
order: 10000
