$kind: http-request
description: |-
  Expects `400 VALIDATION_ERROR` (limit is 1–100).

  Negative check: the request is refused before any data is read or changed. Safe to run in any environment.
url: "{{baseUrl}}/erp/orders?limit=500"
method: GET
queryParams:
  limit: "500"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () {
        pm.expect(pm.response.code).to.equal(400);
      });
      pm.test('error code VALIDATION_ERROR', function () {
        const body = pm.response.json();
        pm.expect(body.success).to.equal(false);
        pm.expect(body.errors[0].code).to.equal('VALIDATION_ERROR');
      });
    language: text/javascript
order: 3000
