$kind: http-request
description: |-
  **GET {{baseUrl}}/erp/items/{sku}** — the one variant carrying this SKU, with its product.

  - Errors: `404 NOT_FOUND` unknown SKU; `409 DUPLICATE_SKU` SKU on two variants.
  - Read-only.

  *Added in API version 2.1. Verified by a local Postman CLI run (see the spec, Section 15.7); not yet run against production.*
url: "{{baseUrl}}/erp/items/{{itemSku}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () {
        pm.expect(pm.response.code).to.equal(200);
      });
      pm.test('data matches the documented schema', function () {
        pm.response.to.have.jsonSchema({
          type: 'object', required: ['success', 'data'],
          properties: {
            success: { const: true },
            data: { type: 'object', required: ['productId', 'name', 'variant'], properties: {
              productId: { type: 'string', pattern: '^[a-f0-9]{24}$' },
              variant: { type: 'object', required: ['sku', 'variantId', 'offerPrice', 'actualPrice', 'stock'], properties: {
                variantId: { type: 'string', pattern: '^[a-f0-9]{24}$' }, stock: { type: 'integer' } } } } },
          },
        });
      });
      pm.test('returns the requested SKU', function () {
        pm.expect(pm.response.json().data.variant.sku).to.equal(pm.variables.get('itemSku'));
      });
    language: text/javascript
order: 10000
