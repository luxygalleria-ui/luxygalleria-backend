$kind: http-example
request:
  url: "{{baseUrl}}/erp/giftboxes"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "sku": "{{itemSku}}"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "SKU not found: NO-SUCH-SKU",
        "errors": [
          {
            "code": "NOT_FOUND",
            "field": "sku"
          }
        ]
      }
order: 4000
