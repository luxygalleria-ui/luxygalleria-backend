$kind: http-example
request:
  url: "{{baseUrl}}/erp/brands/{{brandId}}"
  method: GET
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "id must be a 24-character hex id",
        "errors": [
          {
            "code": "VALIDATION_ERROR",
            "field": "id"
          }
        ]
      }
order: 3000
