$kind: http-example
request:
  url: "{{baseUrl}}/erp/brands/{{brandId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "INACTIVE",
        "displayOrder": 999
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Validation failed",
        "errors": [
          {
            "code": "VALIDATION_ERROR",
            "message": "send at least one field to change"
          }
        ]
      }
order: 3000
