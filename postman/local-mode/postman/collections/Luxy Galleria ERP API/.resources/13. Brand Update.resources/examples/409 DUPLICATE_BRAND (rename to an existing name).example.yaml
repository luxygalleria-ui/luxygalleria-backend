$kind: http-example
request:
  url: "{{baseUrl}}/erp/brands/{{brandId}}"
  method: PATCH
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "INACTIVE",
        "displayOrder": 999
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "A brand with this name already exists",
        "errors": [
          {
            "code": "DUPLICATE_BRAND",
            "field": "name",
            "brandId": "6ae9c44baa53391159c27a02"
          }
        ]
      }
order: 2000
